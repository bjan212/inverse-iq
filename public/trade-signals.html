<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade AI Signals on DEX - Xrypt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .wallet-section {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
        }

        .wallet-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .signals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .signal-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }

        .signal-card:hover {
            transform: translateY(-5px);
        }

        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .signal-symbol {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .signal-direction {
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .direction-long {
            background: #4CAF50;
            color: white;
        }

        .direction-short {
            background: #f44336;
            color: white;
        }

        .signal-details {
            margin: 15px 0;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-label {
            color: #666;
            font-size: 14px;
        }

        .detail-value {
            font-weight: 600;
            color: #333;
        }

        .confidence-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.3s;
        }

        .trade-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .amount-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .btn-trade {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-trade:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-trade:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .status-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .network-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body>
<!-- Xrypt Navigation Bar -->

        position: fixed;
        top: 0;

        right: 0;
        background: rgba(3, 7, 18, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(74, 222, 128, 0.2);
        z-index: 1000;
        padding: 15px 0;
    }
    
    .xrypt-nav-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;

    .xrypt-nav-logo {

        font-size: 14px;

    .xrypt-nav-link:hover {

    .xrypt-nav-link.active {

    .xrypt-nav-mobile-toggle {

        cursor: pointer;

        .xrypt-nav-links.active {
            display: flex;

            display: block;

    /* Add padding to body to account for fixed nav */
    body {
        padding-top: 70px;
    }

<nav class="xrypt-nav">
    <div class="xrypt-nav-container">
        <a href="/" class="xrypt-nav-logo">Xrypt</a>
        
        <button class="xrypt-nav-mobile-toggle" onclick="toggleMobileNav()">☰</button>
        
        <div class="xrypt-nav-links" id="xryptNavLinks">
            <a href="/" class="xrypt-nav-link">🏠 Home</a>
            <a href="/signals.html" class="xrypt-nav-link">📊 Signals</a>
            <a href="/trade-analyzer.html" class="xrypt-nav-link">📈 Trade Analyzer</a>
            <a href="/signal-performance.html" class="xrypt-nav-link">🎯 Performance</a>
            <a href="/notifications.html" class="xrypt-nav-link">🔔 Notifications</a>
            <a href="/get-paid-for-data.html" class="xrypt-nav-link">💰 Get Paid</a>
            <a href="/admin.html" class="xrypt-nav-link">⚙️ Admin</a>
        </div>
    </div>
</nav>

<script>
    function toggleMobileNav() {
        const navLinks = document.getElementById('xryptNavLinks');
        navLinks.classList.toggle('active');
    }
    
    // Highlight active page
    document.addEventListener('DOMContentLoaded', function() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.xrypt-nav-link');
        
        navLinks.forEach(link => {
            const linkPath = new URL(link.href).pathname;
            if (currentPath === linkPath || (currentPath === '/' && linkPath === '/')) {
                link.classList.add('active');
            }
        });
    });
</script>


    <div class="container">
        <div class="header">
            <div class="logo">🎯 Xrypt - Trade AI Signals on DEX</div>
            <div class="wallet-section">
                <div id="walletInfo" class="wallet-info" style="display: none;">
                    <span id="walletAddress"></span>
                    <span id="networkBadge" class="network-badge"></span>
                </div>
                <button id="connectWalletBtn" class="btn btn-primary">Connect Wallet</button>
            </div>
        </div>

        <div id="signalsContainer" class="signals-grid">
            <div class="loading">Loading AI signals...</div>
        </div>
    </div>

    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
    <script>
        // Wallet Trading Integration (Frontend)
        class WalletTrading {
            constructor() {
                this.provider = null;
                this.signer = null;
                this.address = null;
                this.chainId = null;
            }

            async connectWallet() {
                if (typeof window.ethereum === 'undefined') {
                    alert('Please install MetaMask to trade on DEX!');
                    return false;
                }

                try {
                    // Request account access
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    
                    // Create provider and signer
                    this.provider = new ethers.providers.Web3Provider(window.ethereum);
                    this.signer = this.provider.getSigner();
                    this.address = await this.signer.getAddress();
                    
                    // Get network
                    const network = await this.provider.getNetwork();
                    this.chainId = network.chainId;

                    console.log('Wallet connected:', this.address);
                    console.log('Network:', network.name, this.chainId);

                    return true;
                } catch (error) {
                    console.error('Wallet connection failed:', error);
                    return false;
                }
            }

            async executeTrade(signal, amount) {
                if (!this.signer) {
                    throw new Error('Wallet not connected');
                }

                // This would call your backend API to execute the trade
                const response = await fetch('/api/dex/execute-signal-trade', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        signalId: signal.signalId,
                        amount: amount,
                        walletAddress: this.address,
                        chainId: this.chainId
                    })
                });

                return await response.json();
            }

            getNetworkName() {
                const networks = {
                    1: 'Ethereum',
                    56: 'BSC',
                    137: 'Polygon',
                    42161: 'Arbitrum'
                };
                return networks[this.chainId] || 'Unknown';
            }

            formatAddress(address) {
                return `${address.substring(0, 6)}...${address.substring(38)}`;
            }
        }

        // Initialize
        const walletTrading = new WalletTrading();
        let currentSignals = [];

        // Connect Wallet Button
        document.getElementById('connectWalletBtn').addEventListener('click', async () => {
            const connected = await walletTrading.connectWallet();
            
            if (connected) {
                document.getElementById('walletAddress').textContent = 
                    walletTrading.formatAddress(walletTrading.address);
                document.getElementById('networkBadge').textContent = 
                    walletTrading.getNetworkName();
                document.getElementById('walletInfo').style.display = 'block';
                document.getElementById('connectWalletBtn').textContent = 'Connected ✓';
                document.getElementById('connectWalletBtn').disabled = true;
                
                // Reload signals with wallet connected
                loadSignals();
            }
        });

        // Load AI Signals
        async function loadSignals() {
            try {
                const response = await fetch('/api/signals');
                const data = await response.json();
                
                if (data.success && data.signals) {
                    currentSignals = data.signals;
                    displaySignals(data.signals);
                }
            } catch (error) {
                console.error('Failed to load signals:', error);
                document.getElementById('signalsContainer').innerHTML = 
                    '<div class="loading">Failed to load signals. Please refresh.</div>';
            }
        }

        // Display Signals
        function displaySignals(signals) {
            const container = document.getElementById('signalsContainer');
            
            if (signals.length === 0) {
                container.innerHTML = '<div class="loading">No signals available at the moment.</div>';
                return;
            }

            container.innerHTML = signals.map(signal => `
                <div class="signal-card">
                    <div class="signal-header">
                        <div class="signal-symbol">${signal.symbol}</div>
                        <div class="signal-direction direction-${signal.direction.toLowerCase()}">
                            ${signal.direction}
                        </div>
                    </div>

                    <div class="signal-details">
                        <div class="detail-row">
                            <span class="detail-label">Entry Price</span>
                            <span class="detail-value">$${signal.averageEntryPrice?.toFixed(2) || 'N/A'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Stop Loss</span>
                            <span class="detail-value">$${signal.stopLoss?.toFixed(2) || 'N/A'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Take Profit</span>
                            <span class="detail-value">$${signal.takeProfit1?.toFixed(2) || 'N/A'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Risk/Reward</span>
                            <span class="detail-value">${signal.riskRewardRatio1 || 'N/A'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Confidence</span>
                            <span class="detail-value">${signal.confidence}%</span>
                        </div>
                    </div>

                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${signal.confidence}%"></div>
                    </div>

                    <div class="trade-section">
                        <input 
                            type="number" 
                            class="amount-input" 
                            placeholder="Amount (USDC)" 
                            id="amount-${signal.signalId}"
                            ${!walletTrading.address ? 'disabled' : ''}
                        >
                        <button 
                            class="btn-trade" 
                            onclick="executeTrade('${signal.signalId}')"
                            ${!walletTrading.address ? 'disabled' : ''}
                        >
                            ${walletTrading.address ? '🚀 Trade on DEX' : '🔒 Connect Wallet to Trade'}
                        </button>
                        <div id="status-${signal.signalId}"></div>
                    </div>
                </div>
            `).join('');
        }

        // Execute Trade
        async function executeTrade(signalId) {
            const signal = currentSignals.find(s => s.signalId === signalId);
            if (!signal) return;

            const amountInput = document.getElementById(`amount-${signalId}`);
            const statusDiv = document.getElementById(`status-${signalId}`);
            const amount = amountInput.value;

            if (!amount || parseFloat(amount) <= 0) {
                statusDiv.innerHTML = '<div class="status-message status-error">Please enter a valid amount</div>';
                return;
            }

            try {
                statusDiv.innerHTML = '<div class="status-message status-info">⏳ Executing trade...</div>';
                
                const result = await walletTrading.executeTrade(signal, amount);
                
                if (result.success) {
                    statusDiv.innerHTML = `
                        <div class="status-message status-success">
                            ✅ Trade executed!<br>
                            <small>TX: ${result.transactionHash?.substring(0, 20)}...</small>
                        </div>
                    `;
                } else {
                    statusDiv.innerHTML = `
                        <div class="status-message status-error">
                            ❌ Trade failed: ${result.error}
                        </div>
                    `;
                }
            } catch (error) {
                statusDiv.innerHTML = `
                    <div class="status-message status-error">
                        ❌ Error: ${error.message}
                    </div>
                `;
            }
        }

        // Load signals on page load
        loadSignals();

        // Reload signals every 30 seconds
        setInterval(loadSignals, 30000);
    </script>
</body>
</html>
