<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InverseIQ - AI Trading Signals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(to bottom right, #030712, #1f2937, #111827);
            color: #f3f4f6;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        
        /* Grid Pattern Overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(74, 222, 128, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(74, 222, 128, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            position: relative;
            z-index: 1;
        }
        
        /* Terminal Window */
        .terminal-window {
            max-width: 1400px;
            margin: 0 auto 30px;
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid #374151;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .terminal-header {
            background: #1f2937;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #374151;
        }
        
        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .terminal-dot.red { background: #ef4444; }
        .terminal-dot.yellow { background: #eab308; }
        .terminal-dot.green { background: #22c55e; }
        
        .terminal-title {
            margin-left: 12px;
            font-size: 13px;
            color: #9ca3af;
            font-weight: 500;
        }
        
        .terminal-content {
            padding: 30px;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(74, 222, 128, 0.2);
        }
        
        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }
        
        .logo::before {
            content: '> ';
            color: #22c55e;
        }
        
        .header-stats {
            display: flex;
            gap: 30px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #4ade80;
        }
        
        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .info-card {
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 12px;
            padding: 25px;
            position: relative;
            overflow: hidden;
        }
        
        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #4ade80, #22c55e);
        }
        
        .info-card-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
        }
        
        .info-card-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .info-card-subtitle {
            font-size: 13px;
            color: #888;
        }
        
        .info-card.green .info-card-value {
            color: #4ade80;
        }
        
        .info-card.blue .info-card-value {
            color: #22c55e;
        }
        
        .info-card.purple .info-card-value {
            color: #16a34a;
        }
        
        /* Filters */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 10px 20px;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid #374151;
            border-radius: 8px;
            color: #f3f4f6;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
        }
        
        .filter-btn:hover {
            background: rgba(74, 222, 128, 0.1);
            border-color: #4ade80;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.2);
        }
        
        .filter-btn.active {
            background: #16a34a;
            border-color: #22c55e;
            color: #000000;
            font-weight: 700;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.4);
        }
        
        /* Signals Grid */
        .signals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }
        
        .signal-card {
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .signal-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(74, 222, 128, 0.3);
            border-color: #4ade80;
        }
        
        .signal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #4ade80, #22c55e);
        }
        
        /* Signal Header */
        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .signal-symbol {
            font-size: 24px;
            font-weight: bold;
        }
        
        .signal-direction {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .signal-direction.long {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        
        .signal-direction.short {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }
        
        /* Confidence Bar */
        .confidence-section {
            margin-bottom: 20px;
        }
        
        .confidence-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #888;
        }
        
        .confidence-value {
            font-weight: 700;
            color: #4ade80;
        }
        
        .confidence-bar {
            height: 8px;
            background: rgba(55, 65, 81, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            border-radius: 10px;
            transition: width 1s ease;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }
        
        /* Pattern Info */
        .pattern-info {
            background: rgba(3, 7, 18, 0.6);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #374151;
        }
        
        .pattern-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }
        
        .pattern-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .pattern-stat {
            font-size: 13px;
        }
        
        .pattern-stat-label {
            color: #888;
        }
        
        .pattern-stat-value {
            color: #fff;
            font-weight: bold;
        }
        
        /* Risk Badge */
        .risk-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .risk-badge.very-low {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }
        
        .risk-badge.low {
            background: rgba(139, 195, 74, 0.2);
            color: #8bc34a;
        }
        
        .risk-badge.medium {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        
        .risk-badge.high {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }
        
        /* Reason Box */
        .reason-box {
            background: rgba(3, 7, 18, 0.6);
            border-left: 3px solid #4ade80;
            padding: 12px;
            border-radius: 5px;
            font-size: 13px;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 15px;
            border: 1px solid #374151;
            border-left-width: 3px;
        }
        
        /* Action Button */
        .action-btn {
            width: 100%;
            padding: 12px;
            background: #16a34a;
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 8px;
            color: #000000;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 222, 128, 0.4);
            background: #22c55e;
        }
        
        /* Timestamp */
        .signal-timestamp {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: 10px;
        }
        
        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(74, 222, 128, 0.2);
            border-top-color: #4ade80;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        
        .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .empty-title {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .empty-subtitle {
            color: #888;
            font-size: 16px;
        }
        
        /* Responsive */
        @media (max-width: 1200px) {
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .signals-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                gap: 20px;
            }
            
            .header-stats {
                width: 100%;
                justify-content: space-around;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Terminal Window -->
        <div class="terminal-window">
            <div class="terminal-header">
                <div class="terminal-dot red"></div>
                <div class="terminal-dot yellow"></div>
                <div class="terminal-dot green"></div>
                <div class="terminal-title">inverse-iq:~/signals</div>
            </div>
            <div class="terminal-content">
                <!-- Header -->
                <div class="header">
                    <div class="logo">InverseIQ</div>
            <div class="header-stats">
                <div class="stat-item">
                    <div class="stat-label">Active Signals</div>
                    <div class="stat-value" id="activeSignals">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Avg Confidence</div>
                    <div class="stat-value" id="avgConfidence">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Last Update</div>
                    <div class="stat-value" id="lastUpdate">-</div>
                </div>
                </div>
            </div>
            
            <!-- Dashboard Cards -->
            <div class="dashboard-grid">
            <div class="info-card green">
                <div class="info-card-title">Total Patterns</div>
                <div class="info-card-value" id="totalPatterns">-</div>
                <div class="info-card-subtitle">In database</div>
            </div>
            <div class="info-card blue">
                <div class="info-card-title">Combined Patterns</div>
                <div class="info-card-value" id="combinedPatterns">-</div>
                <div class="info-card-subtitle">Public + Trader confirmed</div>
            </div>
            <div class="info-card purple">
                <div class="info-card-title">Data Sources</div>
                <div class="info-card-value" id="dataSources">-</div>
                <div class="info-card-subtitle">Traders contributing</div>
            </div>
            </div>
            
            <!-- Filters -->
            <div class="filters">
            <button class="filter-btn active" data-filter="all">All Signals</button>
            <button class="filter-btn" data-filter="high">High Confidence (85%+)</button>
            <button class="filter-btn" data-filter="combined">Combined Patterns</button>
            <button class="filter-btn" data-filter="long">LONG Only</button>
            <button class="filter-btn" data-filter="short">SHORT Only</button>
            </div>
            
            <!-- Signals Grid -->
            <div class="signals-grid" id="signalsGrid">
            <!-- Loading state -->
            <div class="loading" id="loadingState">
                <div class="loading-spinner"></div>
                <div>Generating AI signals...</div>
            </div>
            </div>
            </div>
        </div>
    </div>
    
    <script>
        let allSignals = [];
        let currentFilter = 'all';
        
        // Initialize
        async function init() {
            await loadSignals();
            setupFilters();
            setInterval(loadSignals, 60000); // Refresh every minute
        }
        
        // Load signals from API
        async function loadSignals() {
            try {
                const response = await fetch('/api/signals');
                const data = await response.json();
                
                if (data.success) {
                    allSignals = data.signals;
                    updateDashboard(data.stats);
                    renderSignals();
                } else {
                    showEmptyState();
                }
            } catch (error) {
                console.error('Failed to load signals:', error);
                showEmptyState();
            }
        }
        
        // Update dashboard stats
        function updateDashboard(stats) {
            document.getElementById('activeSignals').textContent = stats.activeSignals || 0;
            document.getElementById('avgConfidence').textContent = stats.avgConfidence ? stats.avgConfidence + '%' : '-';
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            document.getElementById('totalPatterns').textContent = stats.totalPatterns || 0;
            document.getElementById('combinedPatterns').textContent = stats.combinedPatterns || 0;
            document.getElementById('dataSources').textContent = stats.dataSources || 0;
        }
        
        // Render signals
        function renderSignals() {
            const grid = document.getElementById('signalsGrid');
            
            // Filter signals
            let filtered = allSignals;
            
            if (currentFilter === 'high') {
                filtered = allSignals.filter(s => s.confidence >= 85);
            } else if (currentFilter === 'combined') {
                filtered = allSignals.filter(s => s.pattern.source === 'combined');
            } else if (currentFilter === 'long') {
                filtered = allSignals.filter(s => s.direction === 'LONG');
            } else if (currentFilter === 'short') {
                filtered = allSignals.filter(s => s.direction === 'SHORT');
            }
            
            if (filtered.length === 0) {
                showEmptyState();
                return;
            }
            
            grid.innerHTML = filtered.map(signal => createSignalCard(signal)).join('');
        }
        
        // Create signal card HTML
        function createSignalCard(signal) {
            const directionClass = signal.direction.toLowerCase();
            const riskClass = signal.riskLevel.toLowerCase().replace('_', '-');
            const confidencePercent = signal.confidence;
            
            return `
                <div class="signal-card">
                    <div class="signal-header">
                        <div class="signal-symbol">${signal.symbol}</div>
                        <div class="signal-direction ${directionClass}">${signal.direction}</div>
                    </div>
                    
                    <div class="confidence-section">
                        <div class="confidence-label">
                            <span>Confidence Score</span>
                            <span class="confidence-value">${confidencePercent}%</span>
                        </div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${confidencePercent}%"></div>
                        </div>
                    </div>
                    
                    <div class="pattern-info">
                        <div class="pattern-title">Pattern Intelligence</div>
                        <div class="pattern-stats">
                            <div class="pattern-stat">
                                <span class="pattern-stat-label">Traders: </span>
                                <span class="pattern-stat-value">${signal.pattern.tradersAffected}</span>
                            </div>
                            <div class="pattern-stat">
                                <span class="pattern-stat-label">Occurrences: </span>
                                <span class="pattern-stat-value">${signal.pattern.totalOccurrences}</span>
                            </div>
                            <div class="pattern-stat">
                                <span class="pattern-stat-label">Total Losses: </span>
                                <span class="pattern-stat-value">$${signal.pattern.totalLosses.toFixed(0)}</span>
                            </div>
                            <div class="pattern-stat">
                                <span class="pattern-stat-label">Risk: </span>
                                <span class="risk-badge ${riskClass}">${signal.riskLevel.replace('_', ' ')}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="reason-box">
                        ${signal.reason}
                    </div>
                    
                    <button class="action-btn" onclick="copySignal('${signal.signalId}')">
                        📋 Copy Trade Setup
                    </button>
                    
                    <div class="signal-timestamp">
                        Generated: ${new Date(signal.generatedAt).toLocaleString()}
                    </div>
                </div>
            `;
        }
        
        // Show empty state
        function showEmptyState() {
            const grid = document.getElementById('signalsGrid');
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📊</div>
                    <div class="empty-title">No Signals Available</div>
                    <div class="empty-subtitle">
                        ${currentFilter === 'all' 
                            ? 'Run the bootstrap script to generate signals' 
                            : 'Try a different filter'}
                    </div>
                </div>
            `;
        }
        
        // Setup filter buttons
        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderSignals();
                });
            });
        }
        
        // Copy signal to clipboard
        function copySignal(signalId) {
            const signal = allSignals.find(s => s.signalId === signalId);
            if (!signal) return;
            
            const text = `
🧠 InverseIQ Signal

Symbol: ${signal.symbol}
Direction: ${signal.direction}
Confidence: ${signal.confidence}%
Risk Level: ${signal.riskLevel}

Pattern Intelligence:
- Traders Affected: ${signal.pattern.tradersAffected}
- Total Occurrences: ${signal.pattern.totalOccurrences}
- Total Losses: $${signal.pattern.totalLosses.toFixed(2)}

Reason: ${signal.reason}

Generated: ${new Date(signal.generatedAt).toLocaleString()}
            `.trim();
            
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Signal copied to clipboard!');
            });
        }
        
        // Initialize on page load
        init();
    </script>
</body>
</html>
