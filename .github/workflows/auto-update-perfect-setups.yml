name: Auto-Update Perfect Setups

on:
  # Run every 30 minutes
  schedule:
    - cron: '*/30 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no perfect setups found'
        required: false
        default: 'false'
  
  # Trigger on repository dispatch
  repository_dispatch:
    types: [perfect-setup-detected]

jobs:
  detect-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Detect Perfect Setups
        id: detect
        run: |
          echo "🔍 Running Perfect Setup Detection..."
          node scripts/detectPerfectSetups.js > /tmp/detection_output.txt 2>&1
          
          # Check if perfect setups were found
          if grep -q "Perfect setups found:" /tmp/detection_output.txt; then
            PERFECT_COUNT=$(grep "Perfect setups found:" /tmp/detection_output.txt | awk '{print $4}')
            echo "perfect_count=$PERFECT_COUNT" >> $GITHUB_OUTPUT
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "✨ Found $PERFECT_COUNT perfect setup(s)"
          else
            echo "perfect_count=0" >> $GITHUB_OUTPUT
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "✅ No perfect setups detected"
          fi
          
          cat /tmp/detection_output.txt
          
      - name: Configure Git
        if: steps.detect.outputs.has_updates == 'true'
        run: |
          git config --global user.name 'Perfect Setup Bot'
          git config --global user.email 'bot@xrypt.net'
          
      - name: Commit Perfect Setups
        if: steps.detect.outputs.has_updates == 'true'
        run: |
          echo "📤 Committing perfect setups to GitHub..."
          git add data/perfect_setups.json
          git commit -m "🎯 Auto-update: ${{ steps.detect.outputs.perfect_count }} perfect setup(s) detected" || echo "No changes to commit"
          
      - name: Push to GitHub
        if: steps.detect.outputs.has_updates == 'true'
        id: push
        run: |
          echo "🚀 Pushing to GitHub..."
          git push origin main
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "✅ Pushed commit: ${COMMIT_HASH:0:7}"
          
      - name: Deploy to DigitalOcean
        if: steps.detect.outputs.has_updates == 'true' && secrets.DO_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Deploying to DigitalOcean droplet..."
            
            cd /opt/trading-data-collection-service || exit 1
            
            echo "📥 Pulling latest changes..."
            git stash
            git pull origin main
            
            echo "📦 Installing dependencies..."
            npm install --production
            
            echo "🔄 Restarting PM2 process..."
            pm2 restart inverseiq || pm2 start ecosystem.config.js
            pm2 save
            
            echo "✅ Deployment complete!"
            pm2 status
            
      - name: Send Notification
        if: steps.detect.outputs.has_updates == 'true'
        run: |
          echo "🔔 Sending deployment notification..."
          node scripts/notifyPerfectSetupDeployment.js --count "${{ steps.detect.outputs.perfect_count }}" --commit "${{ steps.push.outputs.commit_hash }}" || echo "Notification skipped"
          
      - name: Update Deployment Status
        if: always()
        run: |
          echo "📊 Workflow Summary:"
          echo "  Perfect Setups: ${{ steps.detect.outputs.perfect_count }}"
          echo "  Updates Made: ${{ steps.detect.outputs.has_updates }}"
          echo "  Status: ${{ job.status }}"
          
      - name: Upload Detection Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: detection-logs
          path: /tmp/detection_output.txt
          retention-days: 7
          
  cleanup:
    runs-on: ubuntu-latest
    needs: detect-and-deploy
    if: always()
    
    steps:
      - name: Cleanup old artifacts
        uses: actions/github-script@v6
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const oldArtifacts = artifacts.data.artifacts
              .filter(artifact => {
                const age = Date.now() - new Date(artifact.created_at).getTime();
                return age > 7 * 24 * 60 * 60 * 1000; // 7 days
              });
            
            for (const artifact of oldArtifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
